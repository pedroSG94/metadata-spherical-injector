apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace "com.pedro.metadatainjectortest"
  compileSdkVersion 36

  defaultConfig {
    applicationId "com.pedro.metadatainjectortest"
    minSdkVersion 21
    targetSdkVersion 36
    versionCode version_code
    versionName version_name
  }
  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }
  kotlinOptions {
    jvmTarget = '1.8'
  }
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])
  //compile metadatavideo library
  implementation project(':metadatavideo')
  //compile metadataphoto library
  implementation project(':metadataphoto')
}
